kind = "web"
previewPath = "/"
title = "AI Workshop 2026"
description = "An interactive eight-slide presentation website for a college Artificial Intelligence Club workshop in Hyderabad on 30 October 2026, with presentation navigation and editable event placeholders."
version = "1.0.0"
id = "artifacts/ai-workshop-2026"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22947

[services.development]
run = "pnpm --filter @workspace/ai-workshop-2026 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-workshop-2026", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-workshop-2026/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22947"
BASE_PATH = "/"
